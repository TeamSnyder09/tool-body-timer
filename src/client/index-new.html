<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Body Time Tracker</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Tool Body Time Tracker</h1>
            <p>Professional tool body runtime tracking system</p>
        </div>

        <div id="authSection" class="auth-section">
            <h2>Login / Register</h2>
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="app.showAuthTab('login')">Login</button>
                <button class="nav-tab" onclick="app.showAuthTab('register')">Register</button>
            </div>

            <div id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username">
                </div>
                <button class="btn btn-primary btn-full" onclick="app.login()">Login</button>
            </div>

            <div id="registerForm" class="hidden">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="regRole">
                        <option value="viewer">Viewer</option>
                        <option value="operator" selected>Operator</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button class="btn btn-primary btn-full" onclick="app.register()">Register</button>
            </div>

            <div id="alertBox"></div>
        </div>

        <div id="appSection" class="hidden">
            <div class="user-info">
                <div>
                    <strong id="currentUsername"></strong>
                    <span class="user-badge" id="currentUserRole"></span>
                </div>
                <button class="btn btn-secondary" onclick="app.logout()">Logout</button>
            </div>

            <div class="main-content">
                <div class="sidebar">
                    <h3>Quick Actions</h3>
                    <button class="btn btn-primary btn-full" onclick="app.showSection('install')">
                        ➕ Install Tool Body
                    </button>
                    <button class="btn btn-primary btn-full" onclick="app.showSection('update')">
                        🔄 Update Runtime
                    </button>
                    <button class="btn btn-primary btn-full" onclick="app.showSection('list')">
                        📋 View All Tools
                    </button>
                    <button class="btn btn-secondary btn-full" onclick="app.showSection('org')">
                        🏢 Create Organization
                    </button>
                    <button class="btn btn-secondary btn-full" onclick="app.showSection('audit')">
                        📊 Audit Logs
                    </button>
                </div>

                <div class="content-area">
                    <div id="installSection" class="hidden">
                        <h2>Install New Tool Body</h2>
                        <div class="form-group">
                            <label>Tool Body Name</label>
                            <input type="text" id="installName">
                        </div>
                        <div class="form-group">
                            <label>Serial Number</label>
                            <input type="text" id="installSerial">
                        </div>
                        <div class="form-group">
                            <label>Machine ID</label>
                            <input type="text" id="installMachine">
                        </div>
                        <div class="form-group">
                            <label>Initial Runtime (minutes)</label>
                            <input type="number" id="installRuntime" value="0">
                        </div>
                        <button class="btn btn-primary" onclick="app.installToolBody()">Install</button>
                    </div>

                    <div id="updateSection" class="hidden">
                        <h2>Update Runtime</h2>
                        <div class="form-group">
                            <label>Tool Body ID</label>
                            <input type="text" id="updateId">
                        </div>
                        <div class="form-group">
                            <label>Current Runtime (minutes)</label>
                            <input type="number" id="updateRuntime">
                        </div>
                        <button class="btn btn-primary" onclick="app.updateToolBody()">Update</button>
                    </div>

                    <div id="listSection">
                        <h2>Active Tool Bodies</h2>
                        <div id="toolBodyList"></div>
                    </div>

                    <div id="orgSection" class="hidden">
                        <h2>Create Organization</h2>
                        <div class="form-group">
                            <label>Organization Name</label>
                            <input type="text" id="orgName">
                        </div>
                        <button class="btn btn-primary" onclick="app.createOrganization()">Create</button>
                    </div>

                    <div id="auditSection" class="hidden">
                        <h2>Audit Logs</h2>
                        <div id="auditLogList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/app.js"></script>
</body>
</html>
